# Somente o banco de desenvolvimento roda em container.
# Web, API e Worker rodam como processos Node locais (planejamento v0.4, princípio 3).
# Testes e CI usam `embedded-postgres`, nunca este serviço.

name: dungeon-master

services:
  db:
    image: postgres:17.7-alpine
    container_name: dungeon-master-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: dungeon
      POSTGRES_PASSWORD: dungeon
      POSTGRES_DB: dungeon_master
      # Locale e checksums determinísticos entre Windows e macOS.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C --data-checksums"
      TZ: UTC
      PGTZ: UTC
    ports:
      # 5433 no host para não colidir com um PostgreSQL já instalado na máquina.
      - "127.0.0.1:5433:5432"
    volumes:
      - dungeon-master-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dungeon -d dungeon_master"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s

volumes:
  dungeon-master-db-data:
    name: dungeon-master-db-data
