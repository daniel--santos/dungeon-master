packages:
  - "apps/*"
  - "packages/*"
  # Ferramental compartilhado que não é publicado: setup do Vitest, geração de
  # OpenAPI, matriz de CI. Pastas sem `package.json` (como `tooling/windows`)
  # são ignoradas pelo pnpm.
  - "tooling/*"

# Scripts de instalação permitidos. O pnpm 10 bloqueia postinstall por padrão.
# `@embedded-postgres/*` traz os binários do PostgreSQL usados nos testes e
# precisa do postinstall para recriar os symlinks do pacote.
onlyBuiltDependencies:
  - "@embedded-postgres/darwin-arm64"
  - "@embedded-postgres/darwin-x64"
  - "@embedded-postgres/linux-arm64"
  - "@embedded-postgres/linux-x64"
  - "@embedded-postgres/windows-x64"
  - "@tailwindcss/oxide"
  - embedded-postgres
  - esbuild
  - unrs-resolver
